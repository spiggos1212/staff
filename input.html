<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Νέα Καταχώρηση</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="top-nav">
    <div>
      <h1>Νέα καταχώρηση</h1>
      <p class="subtitle">Πρόσθεσε ένα έσοδο ή ένα έξοδο</p>
    </div>
    <a class="nav-link secondary" href="index.html">← Dashboard</a>
  </div>

  <div class="panel">
    <form class="entry-form" id="entry-form">
      <div class="field">
        <label>Τύπος</label>
        <div class="type-toggle">
          <button type="button" id="btn-income" class="income-active">Έσοδο</button>
          <button type="button" id="btn-expense">Έξοδο</button>
        </div>
      </div>
      <div class="field">
        <label for="date">Ημερομηνία</label>
        <input type="date" id="date" required>
      </div>
      <div class="field">
        <label for="description">Περιγραφή</label>
        <input type="text" id="description" placeholder="π.χ. Τιμολόγιο #123" required>
      </div>
      <div class="field">
        <label for="amount">Ποσό (€)</label>
        <input type="number" id="amount" min="0.01" step="0.01" placeholder="0,00" required>
      </div>
      <button type="submit" class="submit-btn">Προσθήκη</button>
    </form>
  </div>

  <div class="panel">
    <h2>Πρόσφατες καταχωρήσεις</h2>
    <table>
      <thead>
        <tr>
          <th>Ημερομηνία</th>
          <th>Τύπος</th>
          <th>Περιγραφή</th>
          <th style="text-align:right;">Ποσό</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="transactions-body"></tbody>
    </table>
  </div>

  <script src="finance.js"></script>
  <script>
    let currentType = 'income';
    const btnIncome = document.getElementById('btn-income');
    const btnExpense = document.getElementById('btn-expense');

    function setType(type) {
      currentType = type;
      btnIncome.classList.toggle('income-active', type === 'income');
      btnExpense.classList.toggle('expense-active', type === 'expense');
    }
    btnIncome.addEventListener('click', () => setType('income'));
    btnExpense.addEventListener('click', () => setType('expense'));

    document.getElementById('date').valueAsDate = new Date();

    function renderList() {
      renderTransactionRows(document.getElementById('transactions-body'), loadTransactions(), (id) => {
        saveTransactions(loadTransactions().filter((t) => t.id !== id));
        renderList();
      });
    }
    renderList();

    document.getElementById('entry-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const date = document.getElementById('date').value;
      const description = document.getElementById('description').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      if (!date || !description || !(amount > 0)) return;

      const list = loadTransactions();
      list.push({ id: genId(), date, type: currentType, description, amount });
      saveTransactions(list);

      document.getElementById('entry-form').reset();
      document.getElementById('date').valueAsDate = new Date();
      setType('income');
      renderList();
    });
  </script>
</body>
</html>
