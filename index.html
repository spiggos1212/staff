<!doctype html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ιωσήφ &amp; Ναταλία</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mynerve&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #2b2a26;
    --ink-soft: #746f64;
    --gold: #ad8a44;
    --gold-deep: #8c6c30;
    --gold-light: #e6d3a3;
    --paper: #fffdf9;
    --font-names: 'Mynerve', cursive;
    --font-names-style: normal;
    --font-names-tracking: -0.06em;
    --font-body: 'EB Garamond', serif;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    position:relative;
    min-height:100vh;
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(ellipse 520px 320px at 8% 15%, rgba(150,148,140,0.16), transparent 60%),
      radial-gradient(ellipse 420px 260px at 95% 8%, rgba(160,155,140,0.14), transparent 55%),
      radial-gradient(ellipse 600px 420px at 45% 95%, rgba(150,148,140,0.15), transparent 60%),
      radial-gradient(ellipse 400px 300px at 100% 80%, rgba(160,155,140,0.12), transparent 55%),
      linear-gradient(150deg, #f8f7f4 0%, #efede8 45%, #f9f8f5 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 16px;
    overflow-x:hidden;
  }

  .spray{ position: fixed; width: 210px; height: 210px; pointer-events:none; z-index: 0; opacity: 0.9; }
  .spray.tr{ top: -20px; right: -20px; }
  .spray.bl{ bottom: -20px; left: -20px; transform: rotate(180deg); }
  .spray svg{ width:100%; height:100%; display:block; }
  @media (max-width: 560px){ .spray{ width: 130px; height: 130px; } }

  .card{
    position:relative;
    z-index: 1;
    width:100%;
    max-width: 500px;
    background: var(--paper);
    text-align:center;
    padding: 54px 34px 46px;
    box-shadow: 0 40px 90px -40px rgba(60,50,20,0.28), 0 2px 14px rgba(60,50,20,0.06);
  }

  .veins{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .veins svg{ width:100%; height:100%; display:block; }

  .inner{ position:relative; z-index:1; }

  .pretitle{
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin: 4px 0 8px;
  }

  .weather{ display:none; font-family: var(--font-body); font-size: 12px; font-weight: 300; color: var(--ink-soft); letter-spacing: 0.02em; margin: 0 0 8px; }
  .weather.show{ display:block; }

  .names{
    font-family: var(--font-names);
    font-style: var(--font-names-style);
    font-weight:400;
    font-size: clamp(50px, 12vw, 76px);
    letter-spacing: var(--font-names-tracking);
    line-height: 1.15;
    margin: 12px 0 0;
    color: var(--ink);
    text-wrap: balance;
  }
  .names .amp{ display:inline-block; font-size: 0.5em; color: var(--gold); margin: 0 6px; vertical-align: middle; }

  .fullnames{
    font-family: var(--font-body);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 10px 0 0;
  }
  .fullnames .sep{ color: var(--gold); margin: 0 12px; }

  .subtitle{ font-family: var(--font-body); font-weight: 300; font-style: italic; font-size: 17.5px; color: var(--ink-soft); margin: 24px 0 0; }

  .rule{ width: 1px; height: 36px; background: linear-gradient(var(--gold), var(--gold-light)); margin: 30px auto; }

  .detail-row{ margin-bottom: 28px; }
  .detail-row:last-child{ margin-bottom: 0; }
  .detail-label{ font-family: var(--font-body); font-size: 10px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-deep); margin: 0 0 8px; }
  .detail-value{ font-family: var(--font-body); font-size: 24px; font-weight: 400; margin: 0; color: var(--ink); min-height: 1em; }
  .detail-sub{ font-family: var(--font-body); font-size: 15.5px; font-weight: 300; color: var(--ink-soft); margin: 3px 0 0; }

  .venue-row{ display:flex; align-items:flex-start; justify-content:center; gap: 48px; }
  .koumbaros{ flex: 0 1 auto; min-width: 0; }
  .kb-label{ font-family: var(--font-body); font-size: 9.5px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin: 0 0 5px; }
  .kb-name{ font-family: var(--font-body); font-size: 15.5px; font-weight: 300; line-height: 1.3; color: var(--ink-soft); margin: 0; min-height: 1.3em; }

  .countdown{ font-family: var(--font-body); font-size: 15.5px; font-weight: 300; color: var(--ink-soft); }
  .countdown b{ font-family: var(--font-body); font-weight: 600; font-size: 14.5px; color: var(--gold-deep); margin: 0 3px; }

  .cta{
    display:inline-block;
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-deep);
    background: transparent;
    border: 1px solid var(--gold);
    padding: 13px 30px;
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .cta:hover{ background: var(--gold); color: #fff; }
  .cta:focus-visible{ outline: 2px solid var(--gold-deep); outline-offset: 2px; }

  .closing{ font-family: var(--font-body); margin-top: 38px; font-weight: 300; font-style: italic; font-size: 16.5px; color: var(--ink-soft); }
  .signature{ margin-top: 6px; font-family: var(--font-names); font-style: var(--font-names-style); letter-spacing: var(--font-names-tracking); font-size: 30px; color: var(--gold-deep); }

  @media (max-width: 420px){
    .card{ padding: 46px 22px 38px; }
    .venue-row{ gap: 8px; }
    .kb-name{ font-size: 13.5px; }
    .detail-value{ font-size: 21px; }
  }

  /* ===== RSVP ===== */
  .rsvp{ margin-top: 40px; padding-top: 34px; border-top: 1px solid #ece7da; text-align: left; }
  .rsvp-title{ font-family: var(--font-body); font-size: 10px; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold-deep); margin: 0 0 16px; text-align: center; }
  .rsvp-field{ margin-bottom: 14px; }
  .rsvp-field label{ display:block; font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .rsvp-field input, .rsvp-field textarea{ width: 100%; padding: 9px 11px; border: 1px solid #d8d2c2; border-radius: 5px; font-family: var(--font-body); font-size: 15px; color: var(--ink); background: #fff; }
  .rsvp-field textarea{ resize: vertical; min-height: 60px; }
  .rsvp-toggle{ display:flex; gap: 8px; }
  .rsvp-toggle button{ flex:1; font-family: var(--font-body); font-size: 14px; padding: 10px; border-radius: 5px; border: 1px solid #d8d2c2; background: #fff; color: var(--ink-soft); cursor: pointer; }
  .rsvp-toggle button.active{ border-color: var(--gold); background: #fbf4e4; color: var(--gold-deep); font-weight: 600; }
  .rsvp-guests{ display: none; }
  .rsvp-guests.show{ display: block; }
  .rsvp-hp{ position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .rsvp-submit{ width: 100%; font-family: var(--font-body); font-size: 12px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: #fff; background: var(--gold-deep); border: none; border-radius: 5px; padding: 13px; cursor: pointer; margin-top: 4px; }
  .rsvp-submit:disabled{ opacity: 0.55; cursor: default; }
  .rsvp-msg{ font-size: 13px; margin-top: 10px; min-height: 1.4em; text-align: center; }
  .rsvp-msg.error{ color: #b23b3b; }
  .rsvp-msg.ok{ color: #3a7d44; }
  .rsvp-done{ display:none; text-align: center; padding: 10px 0; }
  .rsvp-done.show{ display:block; }
  .rsvp-form.hide{ display:none; }
</style>
</head>

  <div class="card">

      <svg viewBox="0 0 500 640" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="veinGold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e6d3a3"/>
            <stop offset="50%" stop-color="#ad8a44"/>
            <stop offset="100%" stop-color="#e6d3a3"/>
          </linearGradient>

          <path d="M-20 40 C 80 20 140 60 220 30 C 300 5 360 40 520 10" stroke-width="1.4"/>

    <div class="inner">
      <p class="pretitle">Σας προσκαλούμε στο γάμο μας</p>

      <p class="fullnames"><span id="groom-surname"></span><span class="sep">&#183;</span><span id="bride-surname"></span></p>

      <p class="subtitle">αποφασίσαμε να γράψουμε μαζί την πιο όμορφη ιστορία</p>

      <div class="rule"></div>

      <div class="detail-row">

        <p class="detail-sub" id="event-time-label"></p>

      <div class="detail-row">

  <script id="app">
  (function () {
    var WEEKDAYS = ['Κυριακή','Δευτέρα','Τρίτη','Τετάρτη','Πέμπτη','Παρασκευή','Σάββατο'];
    var MONTHS_GEN = ['Ιανουαρίου','Φεβρουαρίου','Μαρτίου','Απριλίου','Μαΐου','Ιουνίου','Ιουλίου','Αυγούστου','Σεπτεμβρίου','Οκτωβρίου','Νοεμβρίου','Δεκεμβρίου'];

    var state = {
      groomName: 'Ιωσήφ', groomSurname: 'Χριστιανάκης',
      brideName: 'Ναταλία', brideSurname: 'Παπαζαχαρίου',
      date: '2027-07-10', time: '19:00', venue: 'Κτήμα Κλεοπάτρα',
      kbBride: 'Κάτια Τουρκομάνη', kbGroom: 'Μάνος Γιαννουσάκης'
    };
    var countdownTimer = null;

    function formatGreekDate(dateStr) {
      var parts = dateStr.split('-').map(Number);
      var dt = new Date(parts[0], parts[1] - 1, parts[2]);
      return WEEKDAYS[dt.getDay()] + ', ' + parts[2] + ' ' + MONTHS_GEN[parts[1] - 1] + ' ' + parts[0];
    }

    function weddingDateObj(s) { return new Date(s.date + 'T' + s.time + ':00+03:00'); }

    function renderCountdown(s) {
      var el = document.getElementById('countdown');
      var weddingDate = weddingDateObj(s);
      if (countdownTimer) clearInterval(countdownTimer);
      function tick() {
        var diff = weddingDate.getTime() - Date.now();
        if (diff < 0) { el.innerHTML = 'Ο γάμος μας ήδη γιορτάστηκε! 💍'; clearInterval(countdownTimer); return; }
        var days = Math.floor(diff / 86400000);
        var hours = Math.floor((diff % 86400000) / 3600000);
        var mins = Math.floor((diff % 3600000) / 60000);
        el.innerHTML = '<b>' + days + '</b> ημέρες &nbsp;&middot;&nbsp; <b>' + hours + '</b> ώρες &nbsp;&middot;&nbsp; <b>' + mins + '</b> λεπτά';
      }
      tick();
      countdownTimer = setInterval(tick, 30000);
    }

    function toGCalDate(d) {
      return d.getUTCFullYear() + String(d.getUTCMonth() + 1).padStart(2, '0') + String(d.getUTCDate()).padStart(2, '0') +
        'T' + String(d.getUTCHours()).padStart(2, '0') + String(d.getUTCMinutes()).padStart(2, '0') + '00Z';
    }

    function updateCalendarLink(s) {
      var weddingDate = weddingDateObj(s);
      var endDate = new Date(weddingDate.getTime() + 5 * 60 * 60 * 1000);
      var url = 'https://www.google.com/calendar/render?action=TEMPLATE'
        + '&text=' + encodeURIComponent('Γάμος ' + s.groomName + ' & ' + s.brideName)
        + '&dates=' + toGCalDate(weddingDate) + '/' + toGCalDate(endDate)
        + '&details=' + encodeURIComponent('Σας περιμένουμε να γιορτάσουμε μαζί μας!')
        + '&location=' + encodeURIComponent(s.venue);
      document.getElementById('calendar-link').href = url;
    }

    function render(s) {
      document.getElementById('groom-name').textContent = s.groomName;
      document.getElementById('bride-name').textContent = s.brideName;
      document.getElementById('groom-surname').textContent = s.groomSurname;
      document.getElementById('bride-surname').textContent = s.brideSurname;
      document.getElementById('event-date').textContent = formatGreekDate(s.date);
      document.getElementById('event-time-label').textContent = 'ώρα τελετής ' + s.time;
      document.getElementById('venue-name').textContent = s.venue;
      document.getElementById('kb-bride').textContent = s.kbBride;
      document.getElementById('kb-groom').textContent = s.kbGroom;
      document.title = s.groomName + ' & ' + s.brideName;
      renderCountdown(s);
      updateCalendarLink(s);
    }

    render(state);

    // Τραβάμε τα τρέχοντα στοιχεία από το backend (επεξεργάσιμα από /rsvps/invitation).
    // Αν αποτύχει, μένουν οι παραπάνω τιμές ως fallback.
    fetch('/api/invitation').then(function (res) {
      return res.ok ? res.json() : null;
    }).then(function (data) {
      if (data && data.ok && data.invitation) {
        Object.assign(state, data.invitation);
        render(state);
      }
    }).catch(function () {});

    // Τρέχων καιρός Αθήνας — διακριτικό στοιχείο, αν αποτύχει απλά μένει κρυφό.
    fetch('/api/weather').then(function (res) {
      return res.ok ? res.json() : null;
    }).then(function (data) {
      if (data && data.ok && data.weather) {
        var w = data.weather;
        var el = document.getElementById('weather');
        el.textContent = (w.icon ? w.icon + ' ' : '') + 'Αθήνα ' + w.temp + '°C · ' + w.description;
        el.classList.add('show');
      }
    }).catch(function () {});

    // ===== RSVP =====
    (function initRsvp() {
      var form = document.getElementById('rsvp-form');
      var yesBtn = document.getElementById('rsvp-yes');
      var noBtn = document.getElementById('rsvp-no');
      var guestsField = document.getElementById('rsvp-guests-field');
      var msg = document.getElementById('rsvp-msg');
      var submitBtn = document.getElementById('rsvp-submit');
      var attending = null;

      function selectAttending(value) {
        attending = value;
        yesBtn.classList.toggle('active', value === 'yes');
        noBtn.classList.toggle('active', value === 'no');
        guestsField.classList.toggle('show', value === 'yes');
      }
      yesBtn.addEventListener('click', function () { selectAttending('yes'); });
      noBtn.addEventListener('click', function () { selectAttending('no'); });

      function setMsg(text, kind) {
        msg.textContent = text || '';
        msg.className = 'rsvp-msg' + (kind ? ' ' + kind : '');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var name = document.getElementById('rsvp-name').value.trim();
        if (!name) { setMsg('Συμπλήρωσε το όνομά σου.', 'error'); return; }
        if (!attending) { setMsg('Πες μας αν θα είσαι μαζί μας.', 'error'); return; }

        var payload = {
          name: name,
          attending: attending,
          guestCount: parseInt(document.getElementById('rsvp-guests').value, 10) || 1,
          comment: document.getElementById('rsvp-comment').value.trim(),
          hp: document.getElementById('rsvp-hp').value
        };

        submitBtn.disabled = true;
        setMsg('Αποστολή...', '');

        fetch('/api/rsvp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(function (res) {
          return res.json().then(function (data) { return { ok: res.ok, data: data }; });
        }).then(function (r) {
          if (!r.ok || !r.data.ok) {
            submitBtn.disabled = false;
            setMsg((r.data && r.data.error) || 'Κάτι πήγε στραβά. Δοκίμασε ξανά.', 'error');
            return;
          }
          form.classList.add('hide');
          document.getElementById('rsvp-done').classList.add('show');
        }).catch(function () {
          submitBtn.disabled = false;
          setMsg('Αποτυχία σύνδεσης. Δοκίμασε ξανά.', 'error');
        });
      });
    })();
  })();
  </script>
</body>
</html>
