<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Οικονομικό Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="top-nav">
    <div>
      <h1>Οικονομικό Dashboard</h1>
      <p class="subtitle">Έσοδα, έξοδα &amp; καθαρό κέρδος της εταιρείας</p>
    </div>
    <a class="nav-link" href="input.html">+ Νέα καταχώρηση</a>
  </div>

  <div class="clock-wrap">
    <svg id="analog-clock" width="260" height="260" viewBox="0 0 200 200">
      <circle class="face" cx="100" cy="100" r="95" />
      <g id="ticks"></g>
      <line class="hand hour-hand" id="hour-hand" x1="100" y1="100" x2="100" y2="55" />
      <line class="hand minute-hand" id="minute-hand" x1="100" y1="100" x2="100" y2="35" />
      <line class="hand second-hand" id="second-hand" x1="100" y1="112" x2="100" y2="25" />
      <circle class="center-dot" cx="100" cy="100" r="5" />
    </svg>
  </div>

  <div class="mario-wrap">
    <div class="mario-anchor">
      <div class="mario">
        <div class="m-cap"></div>
        <div class="m-cap-brim"></div>
        <div class="m-face"></div>
        <div class="m-mustache"></div>
        <div class="m-shirt"></div>
        <div class="m-arm m-arm-left"></div>
        <div class="m-arm m-arm-right"></div>
        <div class="m-strap m-strap-left"></div>
        <div class="m-strap m-strap-right"></div>
        <div class="m-overalls"></div>
        <div class="m-button"></div>
        <div class="m-shoe m-shoe-left"></div>
        <div class="m-shoe m-shoe-right"></div>
      </div>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-tile">
      <p class="stat-label">Έσοδα</p>
      <p class="stat-value good" id="stat-income">€0,00</p>
    </div>
    <div class="stat-tile">
      <p class="stat-label">Έξοδα</p>
      <p class="stat-value critical" id="stat-expenses">€0,00</p>
    </div>
    <div class="stat-tile">
      <p class="stat-label">Καθαρό κέρδος</p>
      <p class="stat-value" id="stat-net">€0,00</p>
    </div>
  </div>

  <div class="panel">
    <h2>Έσοδα vs Έξοδα</h2>
    <div class="bar-row">
      <span class="bar-label">Έσοδα</span>
      <div class="bar-track"><div class="bar-fill income" id="bar-income" style="width:0%"></div></div>
      <span class="bar-value" id="bar-income-value">€0,00</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">Έξοδα</span>
      <div class="bar-track"><div class="bar-fill expense" id="bar-expense" style="width:0%"></div></div>
      <span class="bar-value" id="bar-expense-value">€0,00</span>
    </div>
  </div>

  <div class="panel">
    <h2>Καταχωρήσεις</h2>
    <table>
      <thead>
        <tr>
          <th>Ημερομηνία</th>
          <th>Τύπος</th>
          <th>Περιγραφή</th>
          <th style="text-align:right;">Ποσό</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="transactions-body"></tbody>
    </table>
  </div>

  <script src="finance.js"></script>
  <script>
    // --- Αναλογικό ρολόι: χαράξεις ωρών ---
    const ticksGroup = document.getElementById('ticks');
    for (let i = 0; i < 12; i++) {
      const angle = i * 30;
      const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      tick.setAttribute('class', 'tick');
      tick.setAttribute('x1', '100');
      tick.setAttribute('y1', '10');
      tick.setAttribute('x2', '100');
      tick.setAttribute('y2', i % 3 === 0 ? '22' : '18');
      tick.setAttribute('transform', `rotate(${angle} 100 100)`);
      ticksGroup.appendChild(tick);
    }

    const hourHand = document.getElementById('hour-hand');
    const minuteHand = document.getElementById('minute-hand');
    const secondHand = document.getElementById('second-hand');

    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours() % 12;

      const secondDeg = seconds * 6;
      const minuteDeg = minutes * 6 + seconds * 0.1;
      const hourDeg = hours * 30 + minutes * 0.5;

      secondHand.style.transform = `rotate(${secondDeg}deg)`;
      minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
      hourHand.style.transform = `rotate(${hourDeg}deg)`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    function render() {
      const list = loadTransactions();
      const { income, expenses, net } = computeTotals(list);

      document.getElementById('stat-income').textContent = formatCurrency(income);
      document.getElementById('stat-expenses').textContent = formatCurrency(expenses);

      const netEl = document.getElementById('stat-net');
      netEl.textContent = (net >= 0 ? '▲ ' : '▼ ') + formatCurrency(Math.abs(net));
      netEl.className = 'stat-value ' + (net >= 0 ? 'good' : 'critical');

      const max = Math.max(income, expenses, 1);
      document.getElementById('bar-income').style.width = (income / max * 100) + '%';
      document.getElementById('bar-expense').style.width = (expenses / max * 100) + '%';
      document.getElementById('bar-income-value').textContent = formatCurrency(income);
      document.getElementById('bar-expense-value').textContent = formatCurrency(expenses);

      renderTransactionRows(document.getElementById('transactions-body'), list, (id) => {
        saveTransactions(loadTransactions().filter((t) => t.id !== id));
        render();
      });
    }

    render();
  </script>
</body>
</html>
